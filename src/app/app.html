<div class="shell" [class.is-quran]="isQuran()">
  <div class="global-account-wrapper">
    <app-account />
  </div>
  <nav class="sidebar" aria-label="التنقل">
    <div class="brand">
      <span class="brand-mark"><app-icon name="quran" [size]="19" [stroke]="1.9" /></span>
      <span class="brand-name">ختمة</span>
    </div>
    @for (item of sidebar; track item.path) {
      <a class="side-link" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="item.path === '/' ? exactPath : subtree"
        #rla="routerLinkActive" [attr.aria-current]="rla.isActive ? 'page' : null" [attr.title]="item.label">
        <app-icon [name]="item.icon" [size]="22" [stroke]="rla.isActive ? 2 : 1.7" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <main class="content">
    <router-outlet />
  </main>

  <nav class="tabbar" aria-label="التنقل">
    @for (item of tabs; track item.path) {
      <a class="tab" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="item.path === '/' ? exactPath : subtree"
        #rla="routerLinkActive" [attr.aria-current]="rla.isActive ? 'page' : null">
        <app-icon [name]="item.icon" [size]="25" [stroke]="rla.isActive ? 2 : 1.7" />
        <span>{{ item.label }}</span>
      </a>
    }
    <button class="tab" type="button" (click)="moreOpen.set(true)">
      <app-icon name="more" [size]="25" [stroke]="1.7" />
      <span>المزيد</span>
    </button>
  </nav>

  <app-sheet [open]="moreOpen()" (closed)="moreOpen.set(false)" title="المزيد">
    <div class="more-menu">
      <a routerLink="/tadabbur" class="menu-item" (click)="moreOpen.set(false)">
        <app-icon name="lamp" [size]="22" [stroke]="1.7" />
        <span>التدبر</span>
      </a>
      <a routerLink="/calendar" class="menu-item" (click)="moreOpen.set(false)">
        <app-icon name="calendar" [size]="22" [stroke]="1.7" />
        <span>التقويم</span>
      </a>
      <a routerLink="/stats" class="menu-item" (click)="moreOpen.set(false)">
        <app-icon name="stats" [size]="22" [stroke]="1.7" />
        <span>الإحصائيات</span>
      </a>
    </div>
  </app-sheet>
</div>
